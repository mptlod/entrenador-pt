<style>
:root{
  --naranja:#FD5F00;
  --naranja-texto:#B84400;
  --naranja-suave:#FFF0E4;
  --naranja-linea:#FFD2B3;
  --papel:#FFFCF8;
  --blanco:#FFFFFF;
  --tinta:#1F1A17;
  --gris:#6B625B;
  --gris-claro:#9A918A;
  --linea:#EDE3D8;
  --verde:#1D7F45; --verde-suave:#E8F5ED;
  --rojo:#C0322B;  --rojo-suave:#FCEBE9;
  --parcial:#8F5500; --parcial-suave:#FFF4DC;
  --ui:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --marco:5px;
  --cab:92px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;border:var(--marco) solid var(--naranja);
  pointer-events:none;z-index:50;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:6px}
.oculto{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Cabecera ---------- */
.cab{
  display:flex;align-items:center;gap:20px;
  padding:14px calc(var(--marco) + 22px) 12px;
  background:var(--papel);border-bottom:1px solid var(--linea);
}
.cab-info{flex:1;min-width:0}
.cab-marca{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.chip{font-size:13px;font-weight:600;color:var(--naranja-texto);background:var(--naranja-suave);border:1px solid var(--naranja-linea);padding:1px 10px;border-radius:99px}
.enlace{background:none;border:0;padding:2px 0;color:var(--gris);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.enlace:hover{color:var(--naranja-texto)}
.logo{display:block;height:var(--cab);width:auto;flex:none;aspect-ratio:217/300}
.logo-inicio{--cab:150px}
.cab-inicio{display:block;position:relative;border-bottom:0;padding-top:30px;padding-bottom:0}
.cab-inicio .cab-info{max-width:1040px;margin:0 auto;padding-right:150px}
.cab-inicio .logo{position:absolute;top:18px;right:calc(var(--marco) + 22px)}
.cab-inicio h1{font-size:clamp(34px,5.4vw,58px);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:10px 0 14px;max-width:14ch}
.cab-inicio .sub{font-size:clamp(17px,2vw,20px);color:var(--gris);margin:0;max-width:46ch}

.progreso{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:8px}
.prog-txt{font-weight:700;font-size:15px;white-space:nowrap}
.barra{height:4px;background:var(--linea);border-radius:4px;overflow:hidden}
.barra>i{display:block;height:100%;background:var(--naranja);border-radius:4px;transition:width .5s ease}
.prog-barra{flex:1;min-width:120px;max-width:340px}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:13px;color:var(--gris)}
.stats b{color:var(--tinta);font-weight:700}
.stat-mini{display:inline-flex;align-items:center;gap:6px}
.stat-mini .barra{width:34px;height:3px}

/* ---------- Inicio ---------- */
.inicio{max-width:1084px;margin:0 auto;padding:30px calc(var(--marco) + 22px) 64px}

.niveles{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.nivel{
  background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  padding:24px 24px 22px;display:flex;flex-direction:column;
}

.pasos li{counter-increment:p;position:relative;padding:0 0 12px 38px;font-weight:500}
.pasos li::before{
  content:counter(p);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;

.pasos li small{display:block;color:var(--gris-claro);font-weight:400;font-size:13px}
.nota-banco{margin:28px 0 0;font-size:14px;color:var(--gris);border-left:3px solid var(--naranja-linea);padding:4px 0 4px 12px;max-width:70ch}
.continuar{font-size:13px;color:var(--gris);margin:8px 0 0;text-align:center}

}
.btn:hover{background:#FF7A26}
.btn:active{transform:translateY(1px)}

}
.enunciado{
  background:var(--blanco);border:1px solid var(--linea);border-radius:12px;
  padding:26px 30px 30px;position:sticky;top:18px;
  max-height:calc(100vh - 36px);overflow:auto;
}
.enunciado h2{font-family:var(--ui);font-size:15px;font-weight:700;margin:0 0 16px;color:var(--tinta)}

.enunciado .texto p{margin:0 0 1em;text-align:left}
.enunciado .texto p:last-child{margin:0}
.enunciado .texto ul{margin:0 0 1em;padding-left:1.25em}
.enunciado .texto li{margin:0 0 .35em}
.enunciado .texto ul:last-child{margin-bottom:0}

.carril{list-style:none;margin:0;padding:0}
.preg{position:relative;padding:0 0 26px 50px;scroll-margin-top:20px}
.preg::before{
  content:attr(data-n);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;
  background:var(--blanco);border:2px solid var(--naranja);color:var(--naranja-texto);
  font-weight:800;font-size:15px;display:grid;place-items:center;z-index:1;transition:border-color .3s,background .3s,color .3s;
}
.preg:not(:last-child)::after{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--naranja-linea)}
.preg[data-estado="correcto"]::before,.preg[data-estado="valida"]::before{border-color:var(--verde);background:var(--verde);color:#fff}
.preg[data-estado="incorrecto"]::before{border-color:var(--rojo);background:var(--rojo);color:#fff}
.preg[data-estado="parcial"]::before{border-color:var(--parcial);background:var(--parcial);color:#fff}
.preg[data-estado="info"]::before{border-color:var(--gris-claro);color:var(--gris)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3;margin:4px 0 4px}
.preg-ayuda{font-size:13px;color:var(--gris);margin:0 0 10px;display:flex;gap:10px;flex-wrap:wrap}
.tag-np{color:var(--naranja-texto);font-weight:600}
.ops{display:grid;gap:8px}
.op{
  position:relative;display:flex;align-items:flex-start;gap:12px;
  background:var(--blanco);border:1.5px solid var(--linea);border-radius:10px;
  padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s;
}
.op:hover{border-color:var(--naranja-linea)}
.op input{position:absolute;opacity:0;pointer-events:none}
.marca{
  flex:none;width:20px;height:20px;margin-top:2px;border:2px solid #CFC4B9;background:var(--blanco);
  display:grid;place-items:center;transition:border-color .15s,background .15s;
}
.op[data-tipo="unica"] .marca{border-radius:50%}
.op[data-tipo="multiple"] .marca{border-radius:5px}
.marca::after{content:"";width:8px;height:8px;border-radius:50%;background:transparent}
.op[data-tipo="multiple"] .marca::after{width:10px;height:6px;border-radius:0;border-left:2.5px solid transparent;border-bottom:2.5px solid transparent;transform:rotate(-45deg) translate(1px,-1px)}
.op-txt{flex:1}
.op:has(input:checked){border-color:var(--naranja);background:var(--naranja-suave)}
.op input:checked + .marca{border-color:var(--naranja);background:var(--naranja)}
.op[data-tipo="unica"] input:checked + .marca::after{background:var(--tinta)}
.op[data-tipo="multiple"] input:checked + .marca::after{border-color:var(--tinta)}
.op input:focus-visible + .marca{outline:3px solid var(--naranja);outline-offset:3px}
fieldset[disabled] .op{cursor:default}
fieldset[disabled] .op:hover{border-color:var(--linea)}
.op-tag{flex:none;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-top:2px;white-space:nowrap}

/* estados tras corregir */
.op.ok{border-color:var(--verde)!important;background:var(--verde-suave)!important}

.op.ok .op-tag{background:var(--verde);color:#fff}
.op.mal{border-color:var(--rojo)!important;background:var(--rojo-suave)!important}
.op.mal .marca{border-color:var(--rojo)!important;background:var(--rojo)!important}
.op.mal .op-tag{background:var(--rojo);color:#fff}
.op.falta{border-style:dashed!important;border-color:var(--verde)!important;background:var(--blanco)!important}
.op.falta .op-tag{color:var(--verde);border:1px solid var(--verde)}
.op.prior{border-color:var(--naranja)!important}
.op.prior .op-tag{background:var(--naranja-suave);color:var(--naranja-texto);border:1px solid var(--naranja-linea)}
.op.apagada{opacity:.62}

.fb{margin-top:12px;border-radius:10px;padding:12px 16px 13px;font-size:15px;line-height:1.55}
.fb p{margin:0}.fb p+p{margin-top:6px}

.fb[data-e="incorrecto"] .fb-est{color:var(--rojo)}
.fb[data-e="parcial"]{background:var(--parcial-suave)}

.fb[data-e="info"]{background:#F6F2ED}
.fb[data-e="info"] .fb-est{color:var(--gris)}
.fb .pista{color:#4A423C}
.fb .pista b{font-weight:600}

.acciones{padding-left:50px}
.aviso{font-size:13px;color:var(--gris);margin:10px 0 0;text-align:center}

.resultado{margin:6px 0 18px 50px}
.nota{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.nota strong{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.nota span{color:var(--gris);font-size:15px}
.resultado>.barra{display:block}
.claves{
  background:var(--blanco);border:2px solid var(--naranja);border-radius:14px;padding:20px 22px 18px;margin-top:14px;
}
.claves h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
.claves dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
.claves dt{font-weight:700}
.claves dd{margin:0}
.claves h4{font-size:16px;font-weight:700;margin:16px 0 4px;color:var(--naranja-texto)}
.claves .detectar{margin:0;color:#3D3631}
.botones{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.botones .btn{flex:1 1 200px}

.entra{animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Fin de ronda ---------- */
.fin{max-width:720px;margin:0 auto;padding:40px calc(var(--marco) + 22px) 70px}
.fin h1{font-size:clamp(34px,5vw,50px);font-weight:800;letter-spacing:-.035em;margin:0 0 6px;line-height:1.05}
.fin .sub{color:var(--gris);margin:0 0 26px;font-size:18px}
.tabla-fin{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:8px 22px}
.fila{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--linea);align-items:center}
.fila:last-child{border-bottom:0}
.fila .val{font-weight:800;font-size:18px;text-align:right}
.fila .barra{grid-column:1/-1;height:4px}
.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0 24px}
.diag div{border-radius:12px;padding:14px 18px;background:var(--naranja-suave);border:1px solid var(--naranja-linea)}
.diag div.rev{background:var(--blanco);border-color:var(--linea)}
.diag dt{font-size:14px;font-weight:600;color:var(--naranja-texto)}
.diag div.rev dt{color:var(--gris)}
.diag dd{margin:2px 0 0;font-weight:700;font-size:17px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .zona{grid-template-columns:1fr;gap:24px}
  .enunciado{position:static;max-height:none;overflow:visible}
}
@media (max-width:640px){
  :root{--marco:3px;--cab:62px}
  .logo-inicio{--cab:88px}
  .cab-inicio{padding-top:16px}
  .cab-inicio .cab-info{padding-right:72px}
  .cab-inicio .logo{top:12px;right:14px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12.5px;line-height:1.35}
  .stats>span{display:block}
  .stat-mini .barra{display:none}
  .cab-inicio h1{margin-top:4px}
  .cab{padding:10px 16px 10px;gap:12px;align-items:flex-start}
  .inicio,.zona,.fin{padding-left:16px;padding-right:16px}
  .inicio{padding-top:22px}
  .enunciado{padding:20px 18px 22px}
  .enunciado .texto{font-size:16.5px}
  .preg{padding-left:44px}
  .preg::before{width:30px;height:30px;font-size:14px}
  .preg:not(:last-child)::after{left:14px;top:30px}
  .acciones,.resultado{padding-left:0;margin-left:0}
  legend{font-size:18px}
  .claves dl{grid-template-columns:1fr;gap:0}
  .claves dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .entra{animation:none}
  .barra>i{transition:none}
}

const ENUNCIADOS = {
  "2025-1": "Como maestro/a especialista de Pedagogía Terapéutica desempeña sus funciones en un Aula Específica de Educación Especial, en un centro ordinario de Educación Infantil y Primaria de tres líneas. El centro cuenta con todos los recursos personales y materiales para atender las necesidades que presenta el alumnado.\n\nConocido el contexto, debe dar respuesta educativa a una de sus alumnas, cuyo dictamen de escolarización determina necesidades educativas especiales derivadas de un Trastorno del Espectro Autista: Autismo.\n\nDestacamos la siguiente información:\n\n- Actualmente presenta dificultad para seguir órdenes sencillas y responder a preguntas simples.\n\n- Muestra cierto grado de inflexibilidad y rigidez cognitiva, lo cual genera en la alumna enfados.\n\n- Tiene una rutina diaria muy estructurada.\n\n- Es importante tener en cuenta que los periodos de espera pueden resultar especialmente estresantes para ella.\n\n- Muestra una buena capacidad de atención y colaboración en las tareas.\n\n- Presenta un desfase en su desarrollo psicomotor, ya que manifiesta dificultades para coordinar los movimientos de sus extremidades, como por ejemplo bajar escaleras alternando los pies, saltar con los pies juntos…\n\n- Presenta una buena prensión con la pinza, lo cual le permite coger objetos de pequeño tamaño y hacer uso de útiles de escritura.\n\n- Actualmente muestra aleteos y, en ocasiones, se desplaza caminando sobre las puntas de sus pies.\n\n- Presenta intención comunicativa, ya que agarra al adulto de la mano para indicarle su deseo o necesidad.\n\n- Tiene dificultades en la interacción con sus iguales y participación en las actividades en el recreo.\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",

  "2025-3": "Centro de Educación Infantil y Primaria situado en una zona ERACIS (Estrategia Regional Andaluza para la Cohesión e Inclusión social). En él se encuentra escolarizado un alumno que presenta necesidades educativas especiales derivadas de una discapacidad intelectual leve (coeficiente intelectual: 65). El centro cuenta con todos los recursos personales y materiales adecuados para atender sus necesidades.\n\nEstá escolarizado en grupo ordinario con apoyos en periodos variables. Presenta necesidades en el área social y afectiva y precisa atención a nivel curricular, ya que tiene un desfase superior a dos cursos.\n\nEntre sus habilidades destacan más las destrezas manipulativas que las verbales.\n\nMuestra indiferencia hacia las tareas escolares. Tiene la atención bastante dispersa y tiende a abordar su trabajo de forma desordenada y lo abandona ante cualquier dificultad que se le presente. Le resulta difícil seguir la dinámica de clase.\n\nEs un alumno introvertido, por lo que suele aislarse en las diferentes situaciones del aula. Presenta dificultades para relacionarse con sus iguales. No expresa abiertamente sus deseos y emociones y se bloquea con facilidad ante situaciones que no controla.\n\nPlantee para este alumno una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2022-1": "Alumna que presenta Trastorno por Déficit de Atención con Hiperactividad. TDAH: Tipo Combinado, lo que le conlleva a una actividad motriz excesiva con tendencia a actuar por impulsos, suele ser molesta y provoca disrupción en el aula (correr, gritar, salir y entrar, …), es incapaz de controlar de forma voluntaria la atención.\n\nSu motivación es dibujar y ser valorada por sus compañeros/as y profesorado.\n\nEs la menor de dos hermanos, familia implicada y colaboradora, en casa también presenta conductas disruptivas mostrándose siempre inquieta.\n\nSe encuentra escolarizada en modalidad de Grupo Ordinario con Apoyos en Periodos Variables en un Centro de Educación infantil y Primaria, que cuenta con los recursos necesarios para dar una respuesta educativa adecuada. Como maestro/a especialista en Pedagogía Terapéutica del centro educativo.\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2022-2": "Comienza el curso como maestro/a especialista en Pedagogía Terapéutica en un Centro de Educación infantil y Primaria de una línea situado en un contexto urbano.\n\nEl centro dispone de los recursos personales y materiales adecuados para atender a las necesidades del alumnado que escolariza.\n\nEntre el alumnado se encuentra una alumna con Trastornos de la Comunicación. Trastorno Especifico del Lenguaje Mixto, que recibe intervención por parte de la especialista en Audición y Lenguaje y precisa de su atención como maestro/a especialista en Pedagogía Terapéutica, en el proceso de enseñanza aprendizaje.\n\nDe la Evaluación Psicopedagógica destacamos:\n\nDesarrollo cognitivo. Su desarrollo cognitivo se sitúa en un nivel inferior respecto a su edad.\n\nDesarrollo comunicativo lingüístico.\n\n- Dificultad en la comprensión y expresión oral que le provoca escasa capacidad para adaptarse a las distintas situaciones de intercambio social.\n\n- En expresión y comprensión escrita presenta grandes dificultades.\n\nDesarrollo psicomotor. Es funcional, aunque presenta torpeza y pobre coordinación motora, así como dificultades en la lateralidad y el equilibrio.\n\nEn cuanto al Desarrollo social-emocional. No es autónoma para trabajar, depende del adulto o de un compañero/a. Pide ayuda con frecuencia. Mantiene un ritmo de trabajo lento. Tiene dificultades en las interacciones sociales con sus compañeros/as debido a la literalidad con la que entiende y usa el lenguaje y la escasa capacidad que posee para adaptarlo. Responde bien al refuerzo positivo.\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2022-3": "Centro de Educación infantil y Primaria de dos líneas y un Aula Específica de Educación Especial en Centro Ordinario, de la cual es usted tutor/a. Cuenta con los recursos suficientes establecidas por la normativa actual.\n\nEn este contexto, como maestro/a especialista de Pedagogía Terapéutica debe dar respuesta educativa al alumno en cuyo dictamen de escolarización se determinan necesidades educativas especiales derivadas de Trastornos del Espectro Autista. Autismo:\n\n- Marcada dificultad en la comunicación no verbal para usar y comprender gestos, expresiones faciales …\n\n- Escaso contacto visual.\n\n- Poco interés en el otro. Dificultades para comprender lo que los demás piensan o dicen (Falta de empatía o compartir emociones).\n\n- Estereotipias, sobre todo aleteos y pequeños gritos.\n\n- Comportamientos como llanto inconsolable o rabietas en situaciones inapropiadas.\n\n- Pérdida de control frecuente ante situaciones de frustración o exceso de estimulación. Provocando agresiones sobre sí mismo u objetos.\n\n- Juego solitario, ni en paralelo, ni simbólico.\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2019-1": "Centro de Educación infantil y Primaria de una línea en el que está destinado como maestro/a de Pedagogía Terapéutica.\n\nEn dicho centro se encuentra escolarizado un alumno que presenta Trastorno por Déficit de Atención con Hiperactividad: TDAH tipo combinado.\n\nEl alumno tiene reconocido el 36% de minusvalía. En su Dictamen de Escolarización se propone modalidad de escolarización en Grupo Ordinario con Apoyos en Períodos Variables.\n\nPresenta patrones conductuales que interfieren negativamente en su rendimiento académico, suele interrumpir la clase con comentarios extemporáneos verbalizando en voz alta la tarea que se dispone a realizar o con gritos incontrolados cuando se le presenta alguna situación novedosa.\n\nMuestra mayor interés por las tareas que implican el uso de recursos digitales. Es bien aceptado por su grupo de iguales.\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2019-2": "Trabaja usted en un Centro de Educación Infantil y Primaria de dos líneas en el Aula de Educación Especial en Centro Ordinario. El centro cuenta con los recursos necesarios para dar respuesta al alumnado.\n\nEn este aula están escolarizados 3 alumnos con diversas Necesidades Educativas Especiales.\n\nEn el mes de febrero la jefa de estudios le informa de la incorporación, por traslado domicilio, de una nueva alumna procedente de otro centro de la localidad: alumna con Necesidades Educativas Especiales: Discapacidad Intelectual Moderada (CI 35).\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2019-3": "Desempeña su labor profesional como maestro/a de Pedagogía Terapéutica (PT) en un entorno urbano. El nivel socioeconómico de las familias es medio-alto, así como el grado de implicación de las mismas en el proceso educativo de sus hijos/as.\n\nEl centro cuenta con los recursos necesarios para garantizar la inclusión del alumnado.\n\nEn el dictamen de Escolarización del alumno se determina que presenta Necesidades Educativas Especiales. Discapacidad Visual: baja visión de carácter congénito. Modalidad de Escolarización Grupo Ordinario con Apoyos en Períodos Variables.\n\nDesde un punto de vista funcional tiene problemas para el desempeño de tareas como la lectoescritura. La pobre percepción de estímulos le ocasiona fatiga y falta de atención, además de dificultades para imitar conductas, gestos, juegos… Se utiliza, entre otros recursos, el Braille como ayuda para el desarrollo de su aprendizaje.\n\nEs bien aceptado por el grupo en el que está escolarizado desde su ingreso en este centro siendo los compañeros muy receptivos a seguir las indicaciones y pautas que se les proponen para facilitar la inclusión de este alumno de forma segura en el aula y en el centro.\n\nEl alumno empieza a tomar conciencia de sus limitaciones con respecto a sus iguales, lo que motiva conductas de aislamiento y hostilidad, además de baja autoestima.\n\nPlantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2017-1": "Comienza su trabajo en el mes de septiembre en un CEIP de 6 unidades de Educación Infantil y 18 de Educación Primaria situado en un contexto rural. Es el único centro de la localidad.\n\nExisten dos plazas de Pedagogía Terapéutica, una ocupada por un docente definitivo que es el titular del aula de apoyo. La plaza que le es asignada es la de un aula específica que empezó a funcionar el curso pasado y a la que asisten dos alumnas.\n\nEl caso más complejo es el de la alumna M.G. que, según dictamen de escolarización, presenta un Trastorno Grave del Desarrollo como consecuencia de una lesión de origen cerebral. Su mayor afectación se encuentra a nivel cognitivo con un nivel madurativo entre 12-24 meses, según ámbitos. No tiene juego simbólico. Explora su entorno visualmente y es capaz de seguir un estímulo visual y auditivo.\n\nSus capacidades comunicativas son muy limitadas ya que prácticamente no existe lenguaje oral y gestual. Emite sonidos vocálicos. Expresa alegría o enfado en la interacción social. Es capaz de deambular sin apoyos, pero con una marcha inestable, hipotonía y con carencias en la función evitativa. No es autónoma en los desplazamientos en lo referente a la dirección de la marcha ni en la decisión sobre itinerarios. Tampoco es autónoma en la alimentación ni, en definitiva, en ningún aspecto de la vida cotidiana. Presenta un reconocimiento del 65% de discapacidad según el Centro de Valoración y Orientación.\n\nAunque el dictamen de escolarización refleja que dicha alumna es de modalidad de Centro Específico, existe negativa de la familia a la escolarización en el centro específico asignado y la alumna asiste diariamente al aula específica de la cual será usted tutor/a.\n\nAmbos padres trabajan, la alumna asiste al aula matinal antes de la hora de entrada en el colegio y hace uso del comedor por lo que deberá pensar en un sistema ágil de comunicación diaria con la familia. Los padres se muestran muy preocupados por la integración escolar de su hija y por la atención que recibe en el centro. Están satisfechos, colaboran en aquello que se les pide y asiste a reuniones y entrevistas cuando se les solicita.\n\nEl especialista en limitación funcional de la movilidad del EOE especializado le ofrece ayudas técnicas que aún no han sido determinadas por necesitar su opinión. La coordinación con el otro docente de PT es prácticamente inexistente y usted es nombrado/a coordinador/a del Equipo de Orientación. Existe una monitora de educación especial y una maestra especialista en Audición y Lenguaje, ambas atienden también a la alumna.\n\nCUESTIÓN DEL SUPUESTO PRÁCTICO Nº 1\n\nCon todo lo expresado plantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2017-2": "Comenzó su trabajo como maestro/a de Pedagogía Terapéutica en un centro rural con 6 unidades de Educación Infantil y 12 unidades de Educación Primaria. El centro se encuentra en un contexto social desfavorecido donde gran parte de las familias se dedican a empleos agrícolas de temporalidad.\n\nEl jefe de estudios le informó a principios de curso que una de las grandes preocupaciones de todos los profesionales que trabajan en el centro es la atención al alumno C.O. Este alumno, según su dictamen de escolarización, presenta un Trastorno Grave de Conducta (trastorno negativista desafiante). Tiene un comportamiento inadaptado, muestra patrones repetitivos en los que prevalece las agresiones a las personas y a las cosas y pequeños hurtos. No acata las normas y en muchas ocasiones se muestra desafiante y hostil hacia los adultos. En lo que va de curso ha sido expulsado del centro en tres ocasiones. Con estas conductas es un niño poco aceptado por sus iguales, poco sociable ya que no suele interaccionar con su grupo y no muestra empatía. Su nivel de competencia curricular se podría situar en torno a un curso por debajo del que le corresponde por edad, lee y escribe con normalidad y, a pesar de parecer que no atiende en clase, comprende lo que se explica a todo el grupo. Le atrae las tareas o actividades manipulativas (puzles, construcciones...) y de fantasía.\n\nAsiste al aula de apoyo desde el inicio de su escolaridad y en el presente curso sale de su grupo ordinario al aula de apoyo en 5 sesiones. Existe una logopeda compartida con otro centro y una monitora de educación especial, ninguna de ellas atiende al alumno.\n\nSus padres se muestran preocupados y mantienen entrevistas continuas con directora y tutora. Afirman que las expulsiones solo sirven para empeorar las conductas de C.O. ya que las toma como unas vacaciones y cuando regresa al centro vuelve a presentar las mismas conductas no deseables. Solicitan pautas para actuar con su hijo ya que en su domicilio también existen conductas desafiantes.\n\nLa tutora también solicita su ayuda, orientación y el establecimiento de mecanismos de coordinación entre ella y usted. Le informa que se está planteando una posible repetición del alumno y desea saber su opinión.\n\nCUESTIÓN DEL SUPUESTO PRÁCTICO Nº 2\n\nCon todo lo expresado plantee una intervención razonada y fundamentada dentro del marco teórico y en relación con el currículo vigente de la especialidad de la Comunidad Autónoma de Andalucía, así como una propuesta didáctica y organizativa, que permita al tribunal comprobar su formación científica y el dominio de las estrategias docentes como maestro/a de Pedagogía Terapéutica.",
  "2015-1": "En un centro de Educación Infantil y Primaria de 1 línea, con aula de integración, está escolarizado un alumno en la modalidad de Aula ordinaria con apoyos en periodos variables. Además de estar considerado en situación de desventaja sociocultural, presenta las siguientes características, según Dictamen emitido por el EOE de zona:\n\n- Necesidades educativas especiales asociadas a una discapacidad intelectual leve.\n\n- Dificultades de comprensión y expresión verbal.\n\n- Desfase en su nivel de competencia curricular de más de dos cursos.\n\n- Dificultades de pensamiento abstracto y asociativo.\n\n- Aunque está adquiriendo la lecto-escritura, lo hace con mucha lentitud y con continuos retrocesos, solo es capaz de reconocer, leer y escribir sílabas directas, aunque no es capaz de leer palabras completas.\n\n- Presenta asimismo una mala grafomotricidad.\n\n- En cuanto a sus capacidades comunicativas, es capaz de expresar sus necesidades e intereses, aunque con múltiples dislalias, pobreza de vocabulario y estructuras sintácticas simples. A nivel social, el alumno mantiene una buena relación con sus compañeros y compañeras tanto dentro del aula como en el patio de recreo, aunque se muestra reacio a trabajar en grupo, incluso a la hora de realizar tareas que suele ejecutar con éxito.\n\n- Reclama continuamente la atención de su maestra mientras está realizando cualquier tarea, aun las que no le suponen ninguna dificultad.",
  "2015-2": "En un centro de Educación Infantil y Primaria de 1 línea, con Aula de apoyo a la Integración, está escolarizada una alumna que presenta un Trastorno Generalizado del Desarrollo sin especificar, acreditado en su día por la Unidad de Salud Mental de su Hospital de referencia. Está en el Colegio desde los 3 años, y su evolución a lo largo de este tiempo ha sido bastante positiva. Los datos más relevantes de su evaluación Psicopedagógica son los siguientes:\n\n- Manifiesta inmadurez en su desarrollo motor, con falta de coordinación a la hora de correr, recoger una pelota con ambas manos o mantener el equilibrio.\n\n- Controla esfínteres y tiene autonomía para asearse y vestirse, aunque con supervisión de un adulto.\n\n- A nivel social, se suele relacionar bien con sus compañeros/as, aunque tiene muy poca tolerancia a la frustración, emitiendo respuestas de poco control emocional, como tirarse al suelo o chillar, cuando se le lleva la contraria. No suele mirar a la cara a la persona que tiene enfrente, aunque lo hace si se le insiste. Habitualmente se comunica mediante holofrases, siendo raras las construcciones sintácticas de sujeto, verbo y predicado. Presenta múltiples dislalias.\n\n- Es capaz de seguir instrucciones verbales secuenciadas de dos acciones. Está adquiriendo la lectoescritura, aunque con muchas dificultades y lentitud, y con continuas regresiones. Reconoce las vocales y varias consonantes, lee algunas sílabas y es capaz de copiarlas, aunque tiene mala grafía.\n\n- En circunstancias normales realiza las tareas que se le asignan, aunque prefiere trabajar sola.\n\n- Le suelen gustar las tareas de clase y le motiva mucho el que su maestra la felicite.\n\n- Reconoce y escribe los números hasta 20, pero tiene dificultades para asociar número/cantidad.",
  "2013-1": "En un Colegio de Educación Infantil y Primaria de 1 línea con Aula de Integración acaba de matricularse Amina. Su nacionalidad es española, aunque sus padres son de Marruecos. El Equipo de Orientación Educativa de la zona, en su Dictamen de Escolarización, le ha diagnosticado Retraso Mental Grave por Síndrome de Down.\n\nLa alumna no ha estado escolarizada con anterioridad y tampoco ha asistido a ninguna guardería.\n\nAmina presenta un desfase significativo en todas las áreas:\n\nTiene grandes carencias en la percepción auditiva, aunque su discriminación visual es buena.\n\nEn cuanto a las áreas motrices, sus movimientos gruesos son lentos y descoordinados; su motricidad fina es muy deficitaria y su grafomotricidad es nula.\n\nCon respecto al lenguaje, se observa un grave déficit tanto en la comprensión como en la expresión. Su lenguaje espontáneo se limita a palabras-frase. Presenta múltiples dislalias.\n\nA nivel de autonomía personal, Amina controla esfínteres, pero tiene dificultades para desenvolverse de manera independiente por el Centro.\n\nA nivel curricular, no tiene adquirido el concepto de cantidad. No discrimina número ni letras. Reconoce tan solo algunos colores. Sí señala e identifica las partes principales de su cuerpo y de su cara.",
  "2013-2": "En un Colegio de Educación Infantil y Primaria de 2 líneas que cuenta con un Aula de Integración se encuentra matriculado Fernando. En el Dictamen de Escolarización, emitido por el Equipo de Orientación Educativa de la zona, se le ha diagnosticado Trastorno Generalizado no especificado.\n\nEl alumno tiene dificultades para mantener la atención, por lo que precisa supervisión constante en las tareas.\n\nSu percepción visual es buena, pero tiene carencias en la percepción espacio-temporal.\n\nEn lo referente a las áreas motrices, su coordinación dinámica general es aceptable. En cambio, presenta dificultades en la motricidad fina, especialmente en la grafomotricidad.\n\nMuestra un retraso significativo en el Área de Lenguaje, tanto en el ámbito expresivo como comprensivo. Contacta ocularmente cuando se le habla, pero se observan carencias al realizar intercambios comunicativos funcionales con iguales o con adultos.\n\nA nivel social, tiende a aislarse y a no participar de las tareas en grupo. Se relaciona bien con sus maestros/as y es aceptado por sus compañeros/as. En ocasiones presenta conductas disruptivas, especialmente ante la negación de deseos o frente a novedades en las rutinas diarias.\n\nA nivel curricular, reconoce los colores básicos y los números del 0 al 9, asociando las grafías a las cantidades. En lectoescritura, discrimina las vocales y está comenzando a trabajar las consonantes."
};

const TOTAL_BANCO = BANCO.length; // 15
const idDe = s => `${s.anio}-${s.numero}`;
const ACTIVOS = BANCO
  .map(s => ({ ...s, id:idDe(s), enunciado:(ENUNCIADOS[idDe(s)] || "").trim(), pistas:PISTAS[idDe(s)] || {} }))
  .filter(s => s.enunciado.length > 0);
const TOTAL = ACTIVOS.length;
const POR_ID = Object.fromEntries(ACTIVOS.map(s => [s.id, s]));
const MQ_REDUCIR = window.matchMedia("(prefers-reduced-motion: reduce)");
const reducir = () => MQ_REDUCIR.matches;

const estado = { nivel:null, niveles:{} };
function datosNivel(n){
  if(!estado.niveles[n]) estado.niveles[n] = { orden:barajar(ACTIVOS.map(s=>s.id)), pos:0, resultados:{} };
  return estado.niveles[n];
}
function barajar(arr, evitarPrimero){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if(evitarPrimero && a.length>1 && a[0]===evitarPrimero){ const k=1+Math.floor(Math.random()*(a.length-1)); [a[0],a[k]]=[a[k],a[0]]; }
  return a;
}

const $ = (sel, root=document) => root.querySelector(sel);
const ESCAPES = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = t => String(t).replace(/[&<>"']/g, c => ESCAPES[c]);
const opc = (lista, id) => lista.find(o => o.id === id);
const media = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
const minusc = t => t.charAt(0).toLowerCase() + t.slice(1);
const pct = v => v===null ? "—" : Math.round(v*100) + " %";
const tieneReferente = s => (s.medidas.includes("acs_lengua") || s.medidas.includes("acs_mat") || s.medidas.includes("aci")) && s.referente;
function enumerar(items){
  if(items.length<=1) return items.join("");
  return items.slice(0,-1).join(", ") + " y " + items[items.length-1];
}
const nombreRef = id => opc(OPC.referente, id).txt;

function preguntas(s, nivel){
  const q = [
    { key:"modalidad", tipo:"unica", lista:OPC.modalidad, titulo:"¿Qué modalidad de escolarización corresponde al supuesto?" },
    { key:"medidas", tipo:"multiple", lista:OPC.medidas, titulo:"¿Qué medida o medidas específicas plantearías?" }
  ];
  if(tieneReferente(s)) q.push({ key:"referente", tipo:"unica", lista:OPC.referente, titulo:"¿Qué referente curricular adoptarías?" });
  if(nivel === "avanzado" && s.medidas.includes("pe") && s.pe && s.pe.ambitos.length){
    q.push({ key:"pe", tipo:"multiple", lista:OPC.pe, titulo:"¿En qué ámbito o ámbitos centrarías principalmente el Programa Específico?" });
  }
  return q;
}

/* =====================================================================
   CORRECCIÓN
   ===================================================================== */
const pistaHtml = t => t ? `<p class="pista"><b>Pista del enunciado:</b> ${esc(t)}</p>` : "";
const DEF_MODALIDAD = {
  B:"La modalidad B corresponde a grupo ordinario con apoyos en periodos variables.",
  C:"La modalidad C corresponde a aula específica de educación especial en centro ordinario.",
  D:"La modalidad D corresponde a centro específico de educación especial.",
  ninguna:"Solo hay modalidad de escolarización cuando existe dictamen de escolarización por NEE."
};
function porQueNo(s, bloque, id){
  if(s.pistas.sobran && id in s.pistas.sobran) return s.pistas.sobran[id];
  if(bloque === "modalidad") return DEF_MODALIDAD[id] || "";
  if(bloque === "medidas"){
    if(id === "aci" && s.modalidad !== "C") return "La ACI es la medida propia del alumnado escolarizado en modalidades C y D.";
    if((id === "acs_lengua" || id === "acs_mat") && s.modalidad === "C") return "En modalidad C la respuesta curricular se articula mediante la ACI, no mediante ACS.";
    if((id === "acs_lengua" || id === "acs_mat") && s.modalidad === "ninguna") return "La ACS se dirige al alumnado con necesidades educativas especiales, y este supuesto no presenta NEE con dictamen.";
  }
  return "";
}

function evaluarModalidad(s, resp){
  const ok = resp === s.modalidad, marcas = {};
  const pista = s.pistas.modalidad;
  if(ok){
    marcas[resp] = ["ok","Tu respuesta"];
    return { estado:"correcto", puntos:1, marcas, html: pista ? `<p>${esc(pista)}</p>` : "" };
  }
  marcas[resp] = ["mal","Tu respuesta"];
  marcas[s.modalidad] = ["falta","Respuesta correcta"];
  const extra = porQueNo(s, "modalidad", resp);
  return { estado:"incorrecto", puntos:0, marcas,
    html:`<p>La respuesta correcta era: <b>${esc(opc(OPC.modalidad, s.modalidad).txt)}</b>.</p>` + (extra ? `<p>${esc(extra)}</p>` : "") + pistaHtml(pista) };
}

function evaluarReferente(s, resp){
  const { validas, preferente } = s.referente, pref = preferente || validas[0], marcas = {};
  const pista = s.pistas.referente;
  if(validas.includes(resp)){
    marcas[resp] = ["ok","Tu respuesta"];
    if(resp === pref){
      const otras = validas.filter(v => v !== pref);
      let html = pista ? `<p>${esc(pista)}</p>` : "";
      if(otras.length) html += `<p>También se admite ${esc(enumerar(otras.map(id=>minusc(nombreRef(id)))))}.</p>`;
      return { estado:"correcto", puntos:1, marcas, html };
    }
    marcas[pref] = ["falta","Recomendado"];
    return { estado:"valida", puntos:1, marcas,
      html:`<p>Tu elección es válida. No obstante, para la resolución de este supuesto recomendamos ${esc(minusc(nombreRef(pref)))}.</p>` + pistaHtml(pista) };
  }
  marcas[resp] = ["mal","Tu respuesta"];
  validas.forEach(v => marcas[v] = ["falta", v === pref ? (validas.length > 1 ? "Recomendado" : "Respuesta correcta") : "También válido"]);
  const otras = validas.filter(v => v !== pref);
  const html = `<p>La respuesta correcta era: <b>${esc(nombreRef(pref))}</b>${otras.length ? ` (también se admite ${esc(enumerar(otras.map(id=>minusc(nombreRef(id)))))})` : ""}.</p>` + pistaHtml(pista);
  return { estado:"incorrecto", puntos:0, marcas, html };
}

function evaluarConjunto(q, s, correctas, resp, bloque, admitidos = []){
  const U = new Set(resp);
  const validas = new Set([...correctas, ...admitidos]);
  const aciertos = resp.filter(x => validas.has(x));
  const faltan = correctas.filter(x => !U.has(x));
  const sobran = resp.filter(x => !validas.has(x));
  const admNoMarcados = admitidos.filter(x => !U.has(x));
  const union = new Set([...correctas, ...resp]).size;
  const puntos = union ? aciertos.length / union : 0;
  const art = id => opc(q.lista, id).art;
  const clave = id => opc(q.lista, id).clave;
  const pista = s.pistas[bloque];
  const marcas = {};
  aciertos.forEach(id => marcas[id] = ["ok","Correcta"]);
  sobran.forEach(id => marcas[id] = ["mal","Sobra"]);
  faltan.forEach(id => marcas[id] = ["falta","Faltaba"]);
  admNoMarcados.forEach(id => marcas[id] = ["falta","También válida"]);
  const notaAdm = admitidos.length ? `También se admite ${enumerar(admitidos.map(art))}.` : "";
  const detFaltan = bloque === "medidas" ? faltan.map(id => (s.pistas.faltan && s.pistas.faltan[id]) || "").filter(Boolean) : [];
  const extras = sobran.map(id => porQueNo(s, bloque, id)).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join("");
  const faltanHtml = detFaltan.map(t=>`<p>${esc(t)}</p>`).join("");

  if(!faltan.length && !sobran.length){
    const nota = admNoMarcados.length ? `<p>${esc(notaAdm)}</p>` : "";
    return { estado:"correcto", puntos:1, marcas, html: nota + (pista ? `<p>${esc(pista)}</p>` : "") };
  }
  if(aciertos.length){
    const falta = `${faltan.length>1?"faltan":"falta"} ${enumerar(faltan.map(art))}`;
    const sobra = `${sobran.length>1?"sobran":"sobra"} ${enumerar(sobran.map(art))}`;
    let frase = `Has identificado correctamente ${enumerar(aciertos.map(art))}, pero `;
    frase += (faltan.length && sobran.length) ? `${falta}. Además, ${sobra}.` : (faltan.length ? falta : sobra) + ".";
    return { estado:"parcial", puntos, marcas, html:`<p>${esc(frase)}</p>` + faltanHtml + extras + (detFaltan.length ? "" : pistaHtml(pista)) };
  }
  const lista = correctas.map(clave).map((t,i)=> (bloque === "pe" && i>0) ? minusc(t) : t).join(" + ");
  return { estado:"incorrecto", puntos:0, marcas,
    html:`<p>La respuesta correcta era: <b>${esc(lista)}</b>${admitidos.length ? ` (${esc(minusc(notaAdm).replace(/\.$/, ""))})` : ""}.</p>` + faltanHtml + extras + (detFaltan.length ? "" : pistaHtml(pista)) };
}

function evaluar(q, s, resp){
  if(q.key === "modalidad") return evaluarModalidad(s, resp);
  if(q.key === "referente") return evaluarReferente(s, resp);
  if(q.key === "medidas") return evaluarConjunto(q, s, s.medidas, resp, "medidas");
  return evaluarConjunto(q, s, s.pe.ambitos, resp, "pe", s.pe.admitidos || []);
}

const SIMBOLO = { correcto:["✓","Correcto"], valida:["✓","Respuesta válida"], parcial:["◐","Parcialmente correcto"], incorrecto:["✕","Incorrecto"] };

   VISTAS
   ===================================================================== */
const app = $("#app");
const anuncio = $("#anuncio");
const irArriba = () => window.scrollTo({ top:0, behavior:"instant" });

/* Temporizadores del feedback escalonado. Se cancelan al cambiar de vista
   para que no escriban sobre un DOM que ya no existe. */
let temporizadores = [];
const programar = (fn, ms) => temporizadores.push(setTimeout(fn, ms));
const cancelarTemporizadores = () => { temporizadores.forEach(clearTimeout); temporizadores = []; };

/* Punto unico de render. */
function pintar(html, aviso){
  cancelarTemporizadores();
  app.innerHTML = html;
  colocarLogo();
  irArriba();
  const m = $("main", app);
  if(m){ m.tabIndex = -1; m.focus({ preventScroll:true }); }
  anuncio.textContent = aviso || "";
}

function cabecera(extra, logoClase, cabClase){
  return `<header class="cab ${cabClase||""}">
    <div class="cab-info">${extra}</div>
    <span data-logo="${logoClase||""}"></span>
  </header>`;
}
/* Coloca el nodo del logo en el hueco que deja la plantilla. */
function colocarLogo(){
  const hueco = $("[data-logo]", app); if(!hueco) return;
  LOGO.className = "logo " + hueco.dataset.logo;
  hueco.replaceWith(LOGO);
}

function vistaInicio(){
  estado.nivel = null;
  const sinBanco = TOTAL === 0;
  const cont = n => {
    const d = estado.niveles[n]; if(!d) return "";
    const hechos = Object.keys(d.resultados).length;
    if(hechos === 0 || d.pos >= TOTAL) return "";
    return `<p class="continuar">Continúas en el supuesto ${d.pos+1} de ${TOTAL}</p>`;
  };
  let aviso = "";
  if(sinBanco) aviso = `<p class="nota-banco">Banco pendiente de carga: 0 de ${TOTAL_BANCO} enunciados disponibles. Solo se muestran supuestos cuyo texto procede de su documento original.</p>`;
  else if(TOTAL < TOTAL_BANCO) aviso = `<p class="nota-banco">Disponibles ${TOTAL} de ${TOTAL_BANCO} supuestos del banco. El resto se incorporará cuando se cargue su documento original.</p>`;

  pintar(cabecera(`<h1>Entrenador de Supuestos Prácticos PT</h1>
    <p class="sub">Lee. Detecta. Decide.</p>`, "logo-inicio", "cab-inicio") + `
  <main class="inicio">
    <div class="niveles">
      <section class="nivel" aria-labelledby="n1">
        <p class="nivel-num">Nivel 1</p>
        <h2 id="n1">Principiante</h2>
        <p class="desc">Entrena las tres decisiones fundamentales de cualquier supuesto práctico.</p>
        <ol class="pasos">
          <li>Modalidad</li>
          <li>Medida o medidas</li>
          <li>Referente curricular<small>Únicamente cuando exista ACS o ACI</small></li>
        </ol>
        <button class="btn btn-bloque" data-accion="empezar" data-nivel="principiante" ${sinBanco?"disabled":""}>EMPEZAR NIVEL PRINCIPIANTE</button>
        ${cont("principiante")}
      </section>
      <section class="nivel av" aria-labelledby="n2">
        <p class="nivel-num">Nivel 2</p>
        <h2 id="n2">Avanzado</h2>
        <p class="desc">Identifica el supuesto y da un paso más en la intervención.</p>
        <ol class="pasos">
          <li>Modalidad</li>
          <li>Medida o medidas</li>
          <li>Referente curricular<small>Cuando proceda</small></li>
          <li>Tipo o ámbitos del Programa Específico<small>Cuando forme parte de la solución</small></li>
        </ol>
        <button class="btn btn-bloque" data-accion="empezar" data-nivel="avanzado" ${sinBanco?"disabled":""}>EMPEZAR NIVEL AVANZADO</button>
        ${cont("avanzado")}
      </section>
    </div>
    ${aviso}
  </main>`, "Elige nivel para empezar.");
}

function barraStats(d){
  const res = Object.values(d.resultados);
  const global = media(res.map(r=>r.total/100));
  return `<div class="stats" aria-label="Estadísticas de la sesión">
    <span>Supuestos realizados: <b>${res.length}/${TOTAL}</b></span>
    <span>Supuestos perfectos: <b>${res.filter(r=>r.perfecto).length}</b></span>
    <span class="stat-mini">Acierto global: <b>${pct(global)}</b><span class="barra" aria-hidden="true"><i style="width:${global===null?0:Math.round(global*100)}%"></i></span></span>
  </div>`;
}

const marcaHtml = () => `
  <div class="cab-marca">Entrenador de Supuestos Prácticos PT
    <span class="chip">${estado.nivel === "avanzado" ? "Nivel avanzado" : "Nivel principiante"}</span>
    <button class="enlace" data-accion="cambiar">Cambiar de nivel</button>
  </div>`;

function cabeceraEntrenador(d){
  const hechos = Object.keys(d.resultados).length;
  return cabecera(marcaHtml() + `
    <div class="progreso">
      <span class="prog-txt">Supuesto ${Math.min(d.pos+1,TOTAL)} de ${TOTAL}</span>
      <span class="barra prog-barra" role="progressbar" aria-label="Supuestos completados en la ronda" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${hechos}"><i style="width:${Math.round(hechos/TOTAL*100)}%"></i></span>
    </div>
    <div id="stats">${barraStats(d)}</div>`);
}

function vistaSupuesto(){
  const d = datosNivel(estado.nivel);
  if(d.pos >= d.orden.length){ vistaFin(); return; }
  const s = POR_ID[d.orden[d.pos]];
  const qs = preguntas(s, estado.nivel);
  let parrafos = "", lista = [];
  const cerrarLista = () => { if(lista.length){ parrafos += `<ul>${lista.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`; lista = []; } };
  s.enunciado.split(/\n\s*\n/).forEach(p => {
    p = p.trim();
    if(p.startsWith("- ")) lista.push(p.slice(2));
    else { cerrarLista(); parrafos += `<p>${esc(p)}</p>`; }
  });
  cerrarLista();

  const preguntasHtml = qs.map((q,i) => `
    <li class="preg" id="q-${q.key}" data-n="${i+1}">
      <fieldset>
        <legend>${esc(q.titulo)}</legend>
        <p class="preg-ayuda"><span>${q.tipo==="multiple" ? "Puedes marcar varias opciones." : "Marca una opción."}</span></p>
        <div class="ops">
          ${q.lista.map(o => `
            <label class="op" data-tipo="${q.tipo}" data-op="${o.id}">
              <input type="${q.tipo==="unica"?"radio":"checkbox"}" name="${q.key}" value="${o.id}">
              <span class="marca" aria-hidden="true"></span>
              <span class="op-txt">${esc(o.txt)}</span>
            </label>`).join("")}
        </div>
      </fieldset>
    </li>`).join("");

  app._supuesto = s; app._preguntas = qs;
  pintar(cabeceraEntrenador(d) + `
  <main class="zona">
    <article class="enunciado" aria-labelledby="tit-sup">
      <h2 id="tit-sup">Oposiciones ${s.anio} · Supuesto práctico n.º ${s.numero}</h2>
      <div class="texto">${parrafos}</div>
    </article>
    <section aria-label="Preguntas del supuesto">
      <ol class="carril">${preguntasHtml}</ol>
      <div class="acciones" id="acciones">
        <button class="btn btn-bloque" id="corregir" data-accion="corregir" disabled>CORREGIR SUPUESTO</button>
        <p class="aviso" id="aviso"></p>
      </div>
      <div id="post"></div>
    </section>
  </main>`, `Supuesto ${d.pos+1} de ${TOTAL}. Oposiciones ${s.anio}, supuesto ${s.numero}.`);
  actualizarBoton();
}

function respuestas(){
  const r = {};
  app._preguntas.forEach(q => {
    const marcados = [...app.querySelectorAll(`input[name="${q.key}"]:checked`)].map(i=>i.value);
    r[q.key] = q.tipo === "unica" ? (marcados[0] || null) : marcados;
  });
  return r;
}
function actualizarBoton(){
  const b = $("#corregir", app); if(!b) return;
  const r = respuestas();
  const pendientes = app._preguntas.filter(q => q.tipo==="unica" ? !r[q.key] : !r[q.key].length).length;
  b.disabled = pendientes > 0;
  $("#aviso", app).textContent = pendientes === 0 ? "" :
    (pendientes === 1 ? "Queda 1 pregunta por responder." : `Quedan ${pendientes} preguntas por responder.`);
}

function corregir(){
  const s = app._supuesto, qs = app._preguntas, r = respuestas();
  const d = datosNivel(estado.nivel);
  app.querySelectorAll("fieldset").forEach(f => f.disabled = true);
  $("#acciones", app).remove();

  const evals = qs.map(q => ({ q, e: evaluar(q, s, r[q.key]) }));
  const bloques = {};
  evals.forEach(x => bloques[x.q.key] = x.e.puntos);
  const total = Math.round(media(evals.map(x=>x.e.puntos)) * 100);
  const perfecto = evals.every(x => x.e.puntos === 1);
  d.resultados[s.id] = { total, perfecto, bloques };

  const suave = !reducir(), paso = suave ? 260 : 0;
  $("#q-modalidad", app).scrollIntoView({ behavior: suave ? "smooth" : "auto", block:"start" });
  evals.forEach((x, i) => programar(() => pintarFeedback(x.q, x.e), 120 + i*paso));
  programar(() => {
    pintarFinal(s, total);
    $("#stats", app).innerHTML = barraStats(d);
    const hechos = Object.keys(d.resultados).length;
    const pb = $(".prog-barra", app);
    pb.setAttribute("aria-valuenow", hechos);
    pb.firstElementChild.style.width = Math.round(hechos/TOTAL*100) + "%";
    anuncio.textContent = `Supuesto corregido: ${total} de 100 puntos.`;
  }, 120 + evals.length*paso + (suave ? 120 : 0));
}

function pintarFeedback(q, e){
  const li = $("#q-" + q.key, app); if(!li) return;
  li.dataset.estado = e.estado;
  li.querySelectorAll(".op").forEach(op => {
    const m = e.marcas[op.dataset.op]; if(!m) return;
    op.classList.add(m[0]);
    op.insertAdjacentHTML("beforeend", `<span class="op-tag">${esc(m[1])}</span>`);
  });
  const [sim, etiqueta] = SIMBOLO[e.estado];
  li.querySelector("fieldset").insertAdjacentHTML("afterend",
    `<div class="fb entra" data-e="${e.estado}">
      <p class="fb-est"><span class="sim" aria-hidden="true">${sim}</span>${etiqueta}</p>
      ${e.html}
    </div>`);
}

function pintarFinal(s, total){
  const destino = $("#post", app); if(!destino) return;
  const filas = [];
  filas.push(["Modalidad", opc(OPC.modalidad, s.modalidad).clave]);
  filas.push([s.medidas.length>1 ? "Medidas" : "Medida", OPC.medidas.filter(o=>s.medidas.includes(o.id)).map(o=>o.clave).join(" + ")]);
  if(tieneReferente(s)){
    const { validas, preferente } = s.referente, pref = preferente || validas[0];
    const otras = validas.filter(v=>v!==pref).map(v=>minusc(nombreRef(v)));
    filas.push(["Referente curricular", otras.length ? `${nombreRef(pref)} (recomendado) o ${enumerar(otras)}` : nombreRef(pref)]);
  }
  if(estado.nivel === "avanzado" && s.medidas.includes("pe") && s.pe){
    filas.push(["Programa Específico", s.pe.clave]);
  }
  const detectar = s.pistas.detectar;
  destino.innerHTML = `
    <div class="resultado entra">
      <div class="nota"><strong>${total}</strong><span>/ 100 puntos en este supuesto</span></div>
      <span class="barra" aria-hidden="true"><i style="width:${total}%"></i></span>
      <section class="claves" aria-labelledby="tit-claves">
        <h3 id="tit-claves">Claves del supuesto</h3>
        <dl>${filas.map(([k,v])=>`<dt>${esc(k)}:</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        ${detectar ? `<h4>¿Qué había que detectar?</h4><p class="detectar">${esc(detectar)}</p>` : ""}
      </section>
      <div class="botones">
        <button class="btn" data-accion="nuevo">NUEVO SUPUESTO DEL BANCO</button>
        <button class="btn btn-sec" data-accion="reintentar">VOLVER A INTENTARLO</button>
      </div>
    </div>`;
}

function vistaFin(){
  const d = datosNivel(estado.nivel);
  const res = Object.values(d.resultados);
  const bloque = k => media(res.filter(r=>r.bloques[k]!==undefined).map(r=>r.bloques[k]));
  const filasPct = [["Acierto global", media(res.map(r=>r.total/100))], ["Acierto en modalidad", bloque("modalidad")], ["Acierto en medidas", bloque("medidas")], ["Acierto en referente curricular", bloque("referente")]];
  if(estado.nivel === "avanzado") filasPct.push(["Acierto en Programa Específico", bloque("pe")]);
  const fila = (etq, val, frac) => `<div class="fila"><span>${etq}</span><span class="val">${val}</span>${frac!==undefined ? `<span class="barra" aria-hidden="true"><i style="width:${frac===null?0:Math.round(frac*100)}%"></i></span>` : ""}</div>`;

  pintar(cabecera(marcaHtml()) + `
  <main class="fin">
    <h1>¡Ronda completada!</h1>
    <p class="sub">Has trabajado los ${TOTAL} supuestos del banco.</p>
    <div class="tabla-fin">
      ${fila("Supuestos realizados", `${res.length}/${TOTAL}`)}
      ${fila("Supuestos perfectos", res.filter(r=>r.perfecto).length)}
      ${filasPct.map(([e,v]) => fila(e, pct(v), v)).join("")}
    </div>
    <div class="botones">
      <button class="btn" data-accion="repetir">REPETIR LOS ${TOTAL} SUPUESTOS</button>
    </div>
  </main>`, "Ronda completada.");
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
app.addEventListener("change", e => { if(e.target.matches("input")) actualizarBoton(); });
app.addEventListener("click", e => {
  const b = e.target.closest("[data-accion]"); if(!b || b.disabled) return;
  const d = estado.nivel ? datosNivel(estado.nivel) : null;
  switch(b.dataset.accion){
    case "empezar": if(TOTAL){ estado.nivel = b.dataset.nivel; vistaSupuesto(); } break;
    case "cambiar": vistaInicio(); break;
    case "corregir": corregir(); break;
    case "reintentar": vistaSupuesto(); break;
    case "nuevo": d.pos++; vistaSupuesto(); break;
    case "repetir": {
      const ultimo = d.orden[d.orden.length-1];
      estado.niveles[estado.nivel] = { orden:barajar(ACTIVOS.map(s=>s.id), ultimo), pos:0, resultados:{} };
      vistaSupuesto(); break;
    }
  }
});

vistaInicio();
</script>
</body>
</html>
